function resetConfirmation(button){
 if(!button)return;
 button.dataset.confirming='no';
 button.classList.remove('confirm-green','confirm-red');
 if(button.id==='sessionSummary'){
  button.textContent='Session beenden und Zusammenfassung erstellen';
  button.classList.add('secondary');
 }else if(button.dataset.sessionRestart==='yes'){
  button.textContent='Neue Session starten';
  button.classList.remove('secondary');
 }else if(button.dataset.sessionSummary==='yes'){
  button.textContent='Session beenden und Zusammenfassung erstellen';
  button.classList.add('secondary');
 }
}
function resetAllConfirmations(){
 document.querySelectorAll('[data-confirming="yes"]').forEach(resetConfirmation);
}
function requireSecondClick(button,firstLabel,confirmationLabel,confirmationClass,action){
 if(button.dataset.confirming==='yes'){
  resetAllConfirmations();
  action();
  return;
 }
 resetAllConfirmations();
 button.dataset.confirming='yes';
 button.textContent=confirmationLabel;
 button.classList.remove('secondary','confirm-green','confirm-red');
 button.classList.add(confirmationClass);
}

 if(sessionEnd)return;

 const heading=document.createElement('h2');heading.textContent='Zusammenfassung deiner Session';

 for(const [key,label] of Object.entries(modeNames)){const tr=document.createElement('tr');for(const value of [label,String(sessionCounts[key])]){const td=document.createElement('td');td.textContent=value;tr.append(td)}table.append(tr)}

}

function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function alternatives(s){return s.split(';').map(norm).filter(Boolean)}
function setText(id,s){$(id).textContent=s}
function current(){return deck[pos]}
function sides(w){return reverse?{question:w.de,answer:w.fr}:{question:w.fr,answer:w.de}}
function start(){resetAllConfirmations();if(sessionEnd)return;let u=$('unit').value;let pool=vocab.filter(w=>(u==='all'||w.unit===u||w.unit.startsWith(u)&&u.length===1)&&(!$('missed').checked||missed.has(w.id)));deck=shuffle(pool).slice(0,mode==='challenge'?Math.min(10,pool.length):pool.length);pos=0;correct=0;answered=false;setText('count',`${pool.length} Vokabeln verfügbar${$('missed').checked?' (Fehlerliste)':''}`);render()}
function render(){
 const status=$('status'), game=$('game');
 if(!deck.length){
   game.classList.add('hidden');status.classList.remove('hidden');
   status.replaceChildren();
   const p=document.createElement('p');p.textContent='Keine Vokabeln in dieser Auswahl. Deaktiviere „Nur Fehler wiederholen“ oder wähle einen anderen Vokabelbereich.';
   status.append(p);return;
 }
 if(pos>=deck.length){
   game.classList.add('hidden');status.classList.remove('hidden');status.replaceChildren();
   const h=document.createElement('h2');h.textContent='Geschafft!';
   const p=document.createElement('p');p.textContent=`${correct} von ${deck.length} richtig`;
   const info=document.createElement('p');info.className='hint';info.textContent=`${missed.size} Vokabeln stehen auf deiner Fehlerliste.`;
   const btn=document.createElement('button');btn.textContent='Noch einmal üben';btn.onclick=start;
   status.append(h,p,info,btn);return;
 }
 status.classList.add('hidden');game.classList.remove('hidden');

answered=false;reverse=$('direction').value==='mix'?Math.random()<.5:$('direction').value==='de';let w=current(),s=sides(w);setText('counter',`Vokabel ${pos+1} / ${deck.length} · ${$('unit').options[$('unit').selectedIndex].text}`);setText('score',`${correct} richtig`);$('bar').style.width=`${100*pos/deck.length}%`;setText('promptlabel',reverse?'Übersetze ins Französische':'Übersetze ins Deutsche');setText('prompt',s.question);setText('feedback','');$('accept').classList.add('hidden');$('next').classList.add('hidden');$('typing').classList.toggle('hidden',mode!=='type');$('choices').classList.toggle('hidden',mode!=='choice'&&mode!=='challenge');$('cardactions').classList.toggle('hidden',mode!=='cards');$('reveal').classList.remove('hidden');$('known').classList.add('hidden');$('unknown').classList.add('hidden');$('typed').value='';$('typed').disabled=false;$('submit').disabled=false;
if(mode==='choice'||mode==='challenge'){let other=shuffle(vocab.filter(x=>x.id!==w.id&&(x.unit===w.unit||x.unit[0]===w.unit[0])&&sides(x).answer!==s.answer)).slice(0,3);let opts=shuffle([w,...other]);$('choices').replaceChildren();for(let o of opts){let b=document.createElement('button');b.className='option';b.textContent=sides(o).answer;b.onclick=()=>finish(o.id===w.id,b);$('choices').append(b)}}}
function finish(ok,clicked){if(answered)return;answered=true;recordWord();let w=current(),s=sides(w);if(ok){correct++;missed.delete(w.id)}else missed.add(w.id);setText('score',`${correct} richtig`);let msg=ok?'Richtig!':`Richtige Antwort: ${s.answer}`;setText('feedback',msg);$('feedback').className='feedback '+(ok?'success':'error');$('next').classList.remove('hidden');if(mode==='type'){$('typed').disabled=true;$('submit').disabled=true;if(!ok && $('typed').value.trim())$('accept').classList.remove('hidden')}if(clicked){for(let b of $('choices').children){b.disabled=true;if(b.textContent===s.answer)b.classList.add('good');else if(b===clicked)b.classList.add('bad')}}}
$('accept').onclick=()=>{
 if(mode!=='type'||!answered||$('accept').classList.contains('hidden'))return;
 correct++;missed.delete(current().id);sessionCorrections++;
 setText('score',`${correct} richtig`);
 setText('feedback','Als richtig gewertet. Du kannst mit „Weiter“ fortfahren.');
 $('feedback').className='feedback success';
 $('accept').classList.add('hidden');
};
$('submit').onclick=()=>{if(answered)return;let typed=norm($('typed').value),target=sides(current()).answer;finish(typed.length>0&&alternatives(target).some(a=>typed===a))};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(answered)next();else $('submit').click()}});function next(){pos++;render()}$('next').onclick=next;$('reveal').onclick=()=>{setText('feedback',sides(current()).answer);$('reveal').classList.add('hidden');$('known').classList.remove('hidden');$('unknown').classList.remove('hidden')};$('known').onclick=()=>{recordWord();correct++;missed.delete(current().id);next()};$('unknown').onclick=()=>{recordWord();missed.add(current().id);next()};$('unit').onchange=start;$('direction').onchange=start;$('missed').onchange=start;for(let b of $('modes').children)b.onclick=()=>{mode=b.dataset.mode;for(let x of $('modes').children)x.classList.toggle('active',x===b);start()};start();
</script></body></html>
