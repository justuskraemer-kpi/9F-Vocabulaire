<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Entraînement de vocabulaire français–allemand pour les classes 7F et 9F.">
<title>Atelier de vocabulaire · 7F et 9F</title>
<style>

:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#182b43;background:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column}
main{flex:1}
header{background:#153f75;color:white;padding:20px max(16px,calc((100vw - 900px)/2))}
header small{letter-spacing:.08em;opacity:.8}
h1{margin:7px 0 0;font-size:clamp(24px,4vw,34px)}
main{max-width:900px;margin:24px auto;padding:0 16px 40px}
.panel{background:white;border:1px solid #d9e2ee;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #102f5310}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
label{font-size:13px;font-weight:700;display:grid;gap:5px}
select,button,input{font:inherit}
select,input{border:1px solid #bac9da;border-radius:10px;padding:12px;background:white;min-width:0}
button{border:0;background:#1756a0;color:white;border-radius:10px;padding:12px 17px;cursor:pointer;font-weight:700;touch-action:manipulation}
button.secondary{background:#e7eff8;color:#153f75}
button.confirm-green{background:#16834a;color:white}
button.confirm-red{background:#b42332;color:white}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f6bf48}
button.option{width:100%;text-align:left;background:#f1f6fd;color:#182b43;border:1px solid #d3e1f0;margin:5px 0;font-weight:500}
button.option.good{background:#e0f7e8;border-color:#21965c}
button.option.bad{background:#ffebeb;border-color:#d94e4e}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.modes button{background:#e7eff8;color:#153f75}
.modes button.active{background:#1756a0;color:white}
.prompt{text-align:center;background:#eef5ff;border-radius:15px;padding:30px 14px;margin:15px 0}
.prompt strong{font-size:clamp(24px,5vw,38px);display:block;overflow-wrap:anywhere}
.prompt span{color:#54677f;font-size:14px}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#52647b;font-size:14px}
.feedback{min-height:25px;margin:12px 0;font-weight:700}
.success{color:#167547}
.error{color:#b62d32}
.answer{display:flex;gap:8px;flex-wrap:wrap}
.answer input{flex:1;min-width:170px}
.hidden{display:none!important}
.hint{font-size:13px;color:#64748b}
.progress{height:8px;border-radius:8px;background:#e5edf7;overflow:hidden;margin:10px 0}
.progress>div{height:100%;background:#1974c9;transition:width .2s}
.end{text-align:center;font-size:20px}
.checkbox{display:flex;align-items:center;gap:8px}
.checkbox input{width:18px;height:18px}
.footer{text-align:center;color:#63748b;font-size:12px;margin-top:22px}
@media(max-width:520px){.panel{padding:15px}
.toolbar>*{flex:1}
select{width:100%}
.answer button{width:100%}
}
.session-table{width:100%;border-collapse:collapse;margin:14px 0}
.session-table th,.session-table td{padding:9px;border-bottom:1px solid #d9e2ee;text-align:left}
.session-table th{background:#f1f6fd}
.mini-impressum{color:#8993a1;font-size:10px;text-align:center;line-height:1.5;padding:8px 14px 15px;font-weight:400}
 .lang-switch{float:right;display:flex;gap:7px}
.lang-switch button{background:transparent;border:2px solid transparent;border-radius:9px;padding:5px 8px;font-size:23px;line-height:1.2}
.lang-switch button.lang-active{border-color:#fff;background:#ffffff25}
 .memory-board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:15px 0}
.memory-card{min-height:92px;padding:9px 5px;overflow-wrap:anywhere;border:2px solid #c7d9ee;background:#e8f0fb;color:#153f75;border-radius:12px;font-size:clamp(12px,2.4vw,16px);font-weight:650}
.memory-card.open{background:#fff;border-color:#1756a0}
.memory-card.matched{background:#def5e8;border-color:#24965c;color:#17633b;cursor:default}
.memory-card:disabled{opacity:1}
.memory-card:not(.open):not(.matched){font-size:25px}
@media(max-width:520px){.memory-board{gap:6px}
.memory-card{min-height:80px;padding:6px 3px}
}
 
:root {
  font-family: "DM Sans", system-ui, sans-serif;
  background: #f5f5f1;
  color: #172c42;
  --navy: #14293f;
  --teal: #176b5d;
  --line: #d9e4df;
}
[hidden] { display: none !important; }
header {
  padding: 0 24px;
  background: var(--navy);
  border-bottom: 4px solid #4da492;
}
.masthead { max-width: 900px; margin: auto; padding-top: 18px; }
.lang-switch { float: none; gap: 6px; margin-bottom: 23px; }
.lang-switch button { padding: 8px; border: 1px solid #ffffff45; border-radius: 7px; }
.lang-switch button[aria-pressed="true"] { border-color: white; background: #ffffff22; }
.flag { width: 21px; height: 14px; display: block; border-radius: 2px; }
.flag.fr { background: linear-gradient(90deg,#244891 33.3%,white 33.3% 66.6%,#e64551 66.6%); }
.flag.de { background: linear-gradient(#161617 33.3%,#e83e40 33.3% 66.6%,#ffce54 66.6%); }
.school { font-size: 12px; color: #b5d1d5; }
h1 { font-size: clamp(31px, 6vw, 52px); line-height: 1.05; letter-spacing: -.045em; }
.language-pair { margin: 8px 0 19px; color: #d4e3e6; font-size: 14px; }
.classes { display: flex; gap: 6px; }
.classes button { background: #ffffff12; min-width: 85px; border-radius: 9px 9px 0 0; padding: 10px 20px; }
.classes button[aria-current="page"] { background: #f5f5f1; color: var(--navy); }
main { width: min(100%, 948px); padding: 0 24px 18px; margin: 22px auto 0; }
.panel { border-color: var(--line); box-shadow: 0 4px 15px #173b3110; }
.toolbar select { max-width: 100%; border-color: #b8cbc5; }
.toolbar label { min-width: 0; }
button, .modes button.active { background: var(--teal); }
button.secondary, .modes button { background: #edf3ef; color: #224c44; }
.modes button { padding: 10px 13px; }
.checkbox input { accent-color: var(--teal); }
.hint { color: #4c635b; }
.panel .hint:last-child { margin-bottom: 0; }
.prompt { background: #eaf3ef; }
.progress { background: #e4ebe8; height: 6px; }
.progress > div { background: var(--teal); }
button.option { background: #f8faf8; border-color: var(--line); }
button.option:hover:not(:disabled) { border-color: var(--teal); background: #eaf3ef; }
button.option.good, button.option.bad { opacity: 1; }
.memory-card { background: #edf3ef; border-color: #c8d9d2; color: #224c44; }
.memory-card.open { background: white; border-color: var(--teal); }
.mini-impressum { color: #566b70; }
@media(max-width: 520px) {
  header { padding-inline: 15px; }
  main { padding-inline: 12px; }
  .toolbar > * { flex: 1 1 180px; }
  .modes { gap: 6px; }
  .memory-board { grid-template-columns: repeat(2,minmax(0,1fr)); }
  .memory-card { min-height: 61px; font-size: 13px; }
}

</style>

ta-fr="Unité 3 · Volet 1">Unité 3 · Volet 1</option><option value="3v2" data-de="Unité 3 · Volet 2" data-fr="Unité 3 · Volet 2">Unité 3 · Volet 2</option></select></label><label data-de="Übersetzungsrichtung" data-fr="Sens de traduction">Sens de traduction<select id="9F-direction"><option value="fr" data-de="Französisch → Deutsch" data-fr="Français → allemand">Français → allemand</option><option value="de" data-de="Deutsch → Französisch" data-fr="Allemand → français">Allemand → français</option><option value="mix" data-de="Gemischt" data-fr="Aléatoire">Aléatoire</option></select></label></div><div class="modes" id="9F-modes"><button data-mode="choice" class="active" aria-pressed="true" data-de="Multiple Choice" data-fr="QCM">QCM</button><button data-mode="type" aria-pressed="false" data-de="Eintippen" data-fr="Écrire la réponse">Écrire la réponse</button><button data-mode="cards" aria-pressed="false" data-de="Karteikarten" data-fr="Cartes mémoire">Cartes mémoire</button><button data-mode="memory" aria-pressed="false" data-de="Vokabel-Memory" data-fr="Jeu de mémoire">Jeu de mémoire</button><button data-mode="challenge" aria-pressed="false" data-de="Zeit-Challenge" data-fr="Défi chrono">Défi chrono</button></div><div class="toolbar"><label class="checkbox"><input type="checkbox" id="9F-missed"><span data-de="Nur Fehler wiederholen" data-fr="Réviser uniquement les erreurs">Réviser uniquement les erreurs</span></label><button class="secondary" id="9F-sessionSummary" type="button" data-de="Session beenden und Zusammenfassung erstellen" data-fr="Terminer la session et afficher le bilan">Terminer la session et afficher le bilan</button></div><p class="hint" id="9F-count"></p></section><section class="panel hidden" id="9F-status" aria-live="polite"></section><section class="panel" id="9F-game"><div class="meta"><span id="9F-counter"></span><span id="9F-score"></span></div><div id="9F-chrono-info" class="meta hidden"><strong id="9F-chrono-time"></strong><strong id="9F-chrono <script>
'use strict';
let language='fr';
const tr=(de,fr)=>language==='fr'?fr:de;

function createTrainer(group,vocab) {
const root=document.getElementById('class-'+group);
const $=id=>document.getElementById(group+"-"+id), shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='choice',deck=[],pos=0,correct=0,missed=new Set(),answered=false,reverse=false;
let sessionStart=new Date(),sessionEnd=null,sessionCounts={choice:0,type:0,cards:0,challenge:0,memory:0},sessionWords=new Set(),sessionCorrections=0;

const modeLabels=()=>({choice:tr('Multiple Choice','QCM'),type:tr('Eintippen','Écrire la réponse'),cards:tr('Karteikarten','Cartes mémoire'),challenge:tr('Zeit-Challenge','Défi chrono'),memory:tr('Vokabel-Memory','Jeu de mémoire')});
let feedbackKind = '', chronoEnded = false, memoryFinishedAt = 0;

let chronoTimer=null,chronoDeadline=0,chronoPoints=0,chronoStreak=0,chronoBest=0,chronoAttempted=0,chronoToken=0;
function stopChrono(){if(chronoTimer!==null){clearInterval(chronoTimer);chronoTimer=null}chronoToken++}
function updateChrono(expire=true){let remaining=Math.max(0,Math.ceil((chronoDeadline-Date.now())/1000));setText('chrono-time',tr(`Zeit: ${remaining} s`,`Temps : ${remaining} s`));setText('chrono-points',tr(`${chronoPoints} Punkte · Serie ${chronoStreak}`,`${chronoPoints} points · série ${chronoStreak}`));if(remaining===0&&expire)endChrono()}
function beginChrono(){stopChrono();chronoPoints=0;chronoStreak=0;chronoBest=0;chronoAttempted=0;chronoDeadline=Date.now()+60000;chronoTimer=setInterval(updateChrono,150);updateChrono()}
function endChrono(){if(mode!=='challenge'||sessionEnd)return;stopChrono();chronoEnded=true;$('game').classList.add('hidden');let status=$('status');status.classList.remove('hidden');status.replaceChildren();let h=document.createElement('h2');h.textContent=tr('Zeit abgelaufen!','Temps écoulé !');let p=document.createElement('p');p.textContent=tr(`${chronoPoints} Punkte · ${correct} von ${chronoAttempted} richtig · Trefferquote ${chronoAttempted?Math.round(100*correct/chronoAttempted):0} % · längste Serie ${chronoBest}`,`${chronoPoints} points · ${correct} bonnes réponses sur ${chronoAttempted} · réussite ${chronoAttempted?Math.round(100*correct/chronoAttempted):0} % · meilleure série ${chronoBest}`);let b=document.createElement('button');b.textContent=tr('Erneut 60 Sekunden spielen','Rejouer 60 secondes');b.onclick=start;status.append(h,p,b)}
let memoryCards=[],memoryOpen=[],memoryMatched=new Set(),memoryAttempts=0,memoryPairs=0,memoryStarted=0,memoryLock=false,memoryRound=0;
function initMemory(){
 memoryRound++;memoryOpen=[];memoryMatched.clear();memoryAttempts=0;memoryLock=false;
 // Unique spellings on both sides prevent ambiguous matching.
 const seenFr=new Set(),seenDe=new Set(),chosen=[];
 for(const w of shuffle(deck)){
  const fr=norm(w.fr),de=norm(w.de);
  if(!fr||!de||seenFr.has(fr)||seenDe.has(de))continue;
  seenFr.add(fr);seenDe.add(de);chosen.push(w);if(chosen.length===8)break;
 }
 memoryPairs=chosen.length;memoryStarted=Date.now();memoryFinishedAt=0;
 memoryCards=shuffle(chosen.flatMap(w=>[{id:w.id,side:'fr',value:w.fr},{id:w.id,side:'de',value:w.de}]));
 renderMemory();
}
function renderMemory(){
 if(mode!=='memory'||sessionEnd)return;
 const game=$('game'),status=$('status');
 $('chrono-info').classList.add('hidden');
 if(!memoryPairs){render();return}
 status.classList.add('hidden');game.classList.remove('hidden');
 $('choices').classList.add('hidden');$('typing').classList.add('hidden');$('cardactions').classList.add('hidden');$('accept').classList.add('hidden');$('next').classList.add('hidden');
 $('memory-board').classList.remove('hidden');
 $('promptlabel').textContent=tr('Finde die französisch-deutschen Paare','Retrouve les paires français–allemand');
 $('prompt').lang=language;
 $('prompt').textContent=tr('Vokabel-Memory','Jeu de mémoire');
 $('counter').textContent=tr(`${memoryMatched.size} / ${memoryPairs} Paare`,`${memoryMatched.size} / ${memoryPairs} paires`);
 $('score').textContent=tr(`${memoryAttempts} Versuche`,`${memoryAttempts} essais`);
 $('bar').style.width=`${100*memoryMatched.size/memoryPairs}%`;
 const board=$('memory-board');board.replaceChildren();
 memoryCards.forEach((card,i)=>{

function applyLanguage() {
  document.documentElement.lang=language;
  document.title=tr('Vokabeltrainer · 7F und 9F','Atelier de vocabulaire · 7F et 9F');
  document.querySelectorAll('[data-de][data-fr]').forEach(el=>{

}
function showClass(group) {
  for (const name of Object.keys(trainers)) {
    document.getElementById('class-'+name).hidden=name!==group;

function classFromUrl() {
  const url = new URL(window.location.href);
  const requested = (url.protocol === 'file:' && url.hash
    ? url.hash.slice(1)
    : url.searchParams.get('klasse') ?? url.hash.slice(1)).toUpperCase();
  return Object.hasOwn(trainers, requested) ? requested : '7F';
}

document.querySelectorAll('[data-class]').forEach(button => {
  button.onclick = () => {
    const group = button.dataset.class;
    const url = new URL(window.location.href);
    if (url.protocol === 'file:') {
      // A local file can change its fragment without reloading.
      url.hash = group;
    } else {
      url.searchParams.set('klasse', group);
    }
    if (url.href !== window.location.href) history.pushState(null, '', url);
    showClass(group);
  };
});
